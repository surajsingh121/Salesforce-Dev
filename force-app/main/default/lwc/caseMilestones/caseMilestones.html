<template>
    <lightning-card title="Case Milestones" icon-name="standard:entitlement_policy">
        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-text-align_center">
                <lightning-spinner alternative-text="Loading milestones" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <c-my-custom-modal-lwc if:true={showErrorModal}
                title="Error loading milestones"
                message={errorMessage}
                onclosemodal={handleCloseError}>
            </c-my-custom-modal-lwc>
            <div class="slds-p-around_medium slds-text-color_error">
                {errorMessage}
            </div>
        </template>

        <template if:true={rows.length}>
            <lightning-datatable key-field="id"
                                 data={rows}
                                 columns={columns}
                                 hide-checkbox-column
                                 resize-column-disabled>
            </lightning-datatable>
        </template>

        <template if:false={rows.length}>
            <template if:false={isLoading}>
                <div class="slds-p-around_medium slds-text-color_weak slds-text-align_center">
                    No milestones found for this Case.
                </div>
            </template>
        </template>
    </lightning-card>
</template>
